name: Release

# Builds the installer + portable zip and publishes a GitHub Release. Runs when:
#   - the <Version> in src/Volumy/Volumy.csproj changes on main (the tag vX.Y.Z is created for you),
#   - a tag like v1.0.0 is pushed,
#   - or you click "Run workflow" on the Actions tab.
# If a release for that version already exists, the run does nothing.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - src/Volumy/Volumy.csproj
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $v = "${{ github.ref_name }}".TrimStart("v")
          } else {
            $v = ([xml](Get-Content src/Volumy/Volumy.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          }
          "value=$v" >> $env:GITHUB_OUTPUT
          gh release view "v$v" --repo "${{ github.repository }}" 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release v$v already exists, nothing to do."
            "skip=true" >> $env:GITHUB_OUTPUT
          } else {
            "skip=false" >> $env:GITHUB_OUTPUT
          }
          exit 0

      - name: Publish (self-contained, x64)
        if: steps.version.outputs.skip != 'true'
        run: >
          dotnet publish src/Volumy/Volumy.csproj -c Release -p:Platform=x64 -r win-x64
          --self-contained true -p:Version=${{ steps.version.outputs.value }}
          -o publish/Volumy

      - name: Portable zip
        if: steps.version.outputs.skip != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path publish/Volumy/* -DestinationPath "dist/Volumy-${{ steps.version.outputs.value }}-portable-x64.zip"

      - name: Installer
        if: steps.version.outputs.skip != 'true'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ steps.version.outputs.value }} installer\Volumy.iss

      - name: GitHub Release
        if: steps.version.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: Volumy ${{ steps.version.outputs.value }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
