name: Build

# Compiles on every push and pull request, so a broken build shows up on GitHub
# before anyone tries a release.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build src/Volumy/Volumy.csproj -c Release -p:Platform=x64
